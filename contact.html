<!DOCTYPE html>
<html lang="fi">


<head>
    <meta charset="UTF-8">
    <title>Ota yhteyttä - Mäkelän Tilapuoti</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>


<body>
    <header>
        <img src="images/makelan-tilapuoti-logo-v2.svg"
            alt="Pyöreä merkki, jossa vaalea aitta nousevan korallinpunaisen auringon edessä ja peltovaot, sekä teksti Mäkelän Tilapuoti, Ilmajoki."
            width="500" height="174">
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Etusivu</a></li>
            <li><a href="listing.html">Tuotteet</a></li>
            <li><a href="contact.html">Yhteystiedot</a></li>
            <li><a href="about.html">Meistä</a></li>
        </ul>
    </nav>

    <main>
        <h1>Ota meihin yhteyttä</h1>
        <p>Voit kysyä esim. Tuotteiden toimituksesta tai saatavuudesta!.</p>

        <form id="contact-form">
            <div>
                <label for="name">Nimi</label>
                <input type="text" id="name" name="name" required
                    autocomplete="name" aria-describedby="name-error">
                <p id="name-error" class="error" hidden></p>
            </div>

            <div>
                <label for="email">Sähköposti</label>
                <input type="email" id="email" name="email" required
                    autocomplete="email" aria-describedby="email-error">
                <p id="email-error" class="error" hidden></p>
            </div>

            <div>
                <label for="question">Yhteydenoton syy</label>
                <textarea id="question" name="question" rows="5" required
                        minlength="10" aria-describedby="question-error"></textarea>
                <p id="question-error" class="error" hidden></p>
            </div>

            <button type="submit">Valmis</button>
        </form>

        <p id="form-status" role="status"></p>
    </main>

    <footer>
        <h2>Yhteystiedot</h2>
    </footer>

</body>
</html>
